{% load static %}
{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %}
        Base Title
        {% endblock %}
    </title>
    {% tailwind_css %}
</head>
<body class="bg-[#000]">

<nav class="bg-gray-900 border-b border-gray-800">
    <div class="container mx-auto px-4">
        <div class="flex h-16 items-center justify-between">

            <!-- Logo -->
            <a href="/" class="text-2xl font-bold text-blue-500">
                Dev<span class="text-white">Space</span>
            </a>

            <!-- Desktop Navigation -->
            <div class="hidden items-center gap-8 md:flex">
                <a href="/" class="text-gray-300 transition hover:text-blue-400">
                    Home
                </a>

                <a href="#" class="text-gray-300 transition hover:text-blue-400">
                    About
                </a>

                <a href="#" class="text-gray-300 transition hover:text-blue-400">
                    Services
                </a>

                <a href="#" class="text-gray-300 transition hover:text-blue-400">
                    Contact
                </a>
            </div>

            <!-- Action Button -->
            <a href="#"
               class="hidden rounded-lg bg-blue-600 px-4 py-2 font-medium text-white transition hover:bg-blue-700 sm:inline-block">
                Get Started
            </a>

            <!-- Mobile Menu Button -->
            <button
                id="menu-toggle"
                type="button"
                aria-label="Toggle navigation"
                aria-expanded="false"
                aria-controls="mobile-menu"
                class="rounded-lg p-2 text-gray-300 hover:bg-gray-800 md:hidden">

                <svg xmlns="http://www.w3.org/2000/svg"
                     class="h-6 w-6"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke="currentColor"
                     stroke-width="2">
                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>

        </div>

        <!-- Mobile Navigation -->
        <div id="mobile-menu" class="hidden space-y-2 pb-4 md:hidden">
            <a href="/" class="block rounded-lg px-3 py-2 text-gray-300 hover:bg-gray-800 hover:text-blue-400">
                Home
            </a>

            <a href="#" class="block rounded-lg px-3 py-2 text-gray-300 hover:bg-gray-800 hover:text-blue-400">
                About
            </a>

            <a href="#" class="block rounded-lg px-3 py-2 text-gray-300 hover:bg-gray-800 hover:text-blue-400">
                Services
            </a>

            <a href="#" class="block rounded-lg px-3 py-2 text-gray-300 hover:bg-gray-800 hover:text-blue-400">
                Contact
            </a>

            <a href="#" class="block rounded-lg bg-blue-600 px-3 py-2 text-center font-medium text-white hover:bg-blue-700 sm:hidden">
                Get Started
            </a>
        </div>

    </div>
</nav>

    <div class="container">
        {% block content %}
        Base Content
        {% endblock %}
    </div>
</body>
</html>
